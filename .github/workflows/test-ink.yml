name: test-ink
on:
  workflow_dispatch:
  push:
    branches: [codex/fix-ink-input-ruler, codex/document-canvas-vocab-graph]
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run iPad regression tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPad" in d["name"]))')
          echo "SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test -project PdfVocab.xcodeproj -scheme PdfVocab -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/InkTests.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InkTests
          path: build/InkTests.xcresult
      - name: Collect UI review snapshots
        if: always()
        run: |
          CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.lei11118.pdfvocab data 2>/dev/null || true)
          if [ -d "$CONTAINER/Documents/UIReview" ]; then
            cp -R "$CONTAINER/Documents/UIReview" build/UIReview
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UIReview
          path: build/UIReview
          if-no-files-found: warn
