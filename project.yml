# XcodeGen 工程定义 —— 运行 `xcodegen generate` 生成 PdfVocab.xcodeproj(生成物不入库)
name: PdfVocab

options:
  bundleIdPrefix: com.lei11118
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.5"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.23.1"
    CURRENT_PROJECT_VERSION: "60"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  PdfVocab:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 跃文
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lei11118.pdfvocab
        PRODUCT_NAME: PdfVocab
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: GRDB
      - package: ZIPFoundation

schemes:
  PdfVocab:
    build:
      targets:
        PdfVocab: all
    run:
      config: Debug
    archive:
      config: Release
