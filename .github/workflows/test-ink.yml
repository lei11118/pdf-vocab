name: test-ink
on:
  workflow_dispatch:
    inputs:
      unit_only:
        description: "Run only the PdfVocabTests unit test target"
        type: boolean
        required: false
        default: false
      gesture_only:
        description: "Run only the continuous floating-window gesture regression"
        type: boolean
        required: false
        default: false
      workspace_only:
        description: "Run only the workspace rotation and navigation review"
        type: boolean
        required: false
        default: false
      human_reading_only:
        description: "Run only the searchable-PDF math and live translation/OCR UI audits"
        type: boolean
        required: false
        default: false
      snapshot_run_id:
        description: "Export UI attachments from an existing test run without repeating tests"
        required: false
        default: ""
  push:
    branches: [codex/fix-ink-input-ruler, codex/document-canvas-vocab-graph]
permissions:
  contents: read
  actions: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
jobs:
  test:
    if: ${{ inputs.snapshot_run_id == '' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pdfvocab/ecdict-sqlite-28.zip
          key: ecdict-sqlite-1.0.28
      - name: Build dictionary resources
        run: |
          python3 scripts/build_dict.py
          python3 scripts/build_science.py
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run iPad regression tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys

          devices = json.load(sys.stdin).get("devices", {})
          candidates = []
          prefix = "com.apple.CoreSimulator.SimRuntime.iOS-"
          for runtime, runtime_devices in devices.items():
              if not runtime.startswith(prefix):
                  continue
              try:
                  version = tuple(int(part) for part in runtime[len(prefix):].split("-"))
              except ValueError:
                  continue
              if version < (26, 0):
                  continue
              for device in runtime_devices:
                  if "iPad" in device.get("name", ""):
                      candidates.append((version, runtime, device))

          if not candidates:
              print("ERROR: no available iPad simulator with iOS 26.0 or later was found.", file=sys.stderr)
              sys.exit(1)

          candidates.sort(key=lambda item: item[0], reverse=True)
          version, runtime, device = candidates[0]
          print("Selected {} simulator: {} ({})".format(runtime, device["name"], device["udid"]), file=sys.stderr)
          print(device["udid"])
          ')
          echo "SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          TEST_ARGS=()
          if [ "${{ inputs.unit_only }}" = "true" ]; then
            TEST_ARGS=(-only-testing:PdfVocabTests)
          elif [ "${{ inputs.human_reading_only }}" = "true" ]; then
            TEST_ARGS=(
              -only-testing:ReaderRouteUITests/ReaderRouteUITests/testHumanReadingAuditUsesLiveReaderDictionaryAndMath
              -only-testing:ReaderRouteUITests/ReaderRouteUITests/testHumanReadingAuditUsesLiveTranslationSearchZoomLayoutAndVisionOCR
            )
          elif [ "${{ inputs.gesture_only }}" = "true" ]; then
            xcodebuild -help 2>&1 | sed -n '/only-testing/p'
            TEST_ARGS=(-only-testing:ReaderRouteUITests/ReaderRouteUITests/testResizeAcrossCapsuleThresholdAndKeepArcAnchoredWithSelectionBarOpen)
          elif [ "${{ inputs.workspace_only }}" = "true" ]; then
            TEST_ARGS=(-only-testing:ReaderRouteUITests/ReaderRouteUITests/testWorkspaceNavigationAtPortraitAndLandscapeWidths)
          fi
          xcodebuild test -project PdfVocab.xcodeproj -scheme PdfVocab -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/InkTests.xcresult "${TEST_ARGS[@]}" CODE_SIGNING_ALLOWED=NO
      - name: Collect simulator app diagnostics
        if: ${{ always() && inputs.human_reading_only }}
        run: |
          mkdir -p build/SimulatorDiagnostics
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import uuid
          from pathlib import Path

          base_udid = os.environ.get("SIMULATOR_UDID", "")
          try:
              uuid.UUID(base_udid)
          except ValueError:
              print("Selected simulator UUID unavailable; no app diagnostics collected.")
              sys.exit(0)

          try:
              output = subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "-j"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              devices_by_runtime = json.loads(output).get("devices", {})
          except (OSError, subprocess.CalledProcessError, json.JSONDecodeError):
              print("Simulator inventory unavailable; no app diagnostics collected.")
              sys.exit(0)

          selected_runtime = next(
              (runtime for runtime, devices in devices_by_runtime.items()
               if any(device.get("udid") == base_udid for device in devices)),
              None,
          )
          if selected_runtime is None:
              print("Selected simulator not found; no app diagnostics collected.")
              sys.exit(0)

          output_dir = Path("build/SimulatorDiagnostics")
          captured = 0
          candidates = [
              device for device in devices_by_runtime[selected_runtime]
              if device.get("udid") == base_udid
              or ("iPad" in device.get("name", "") and "clone" in device.get("name", "").lower())
          ]
          for device in candidates:
              udid = device.get("udid", "")
              try:
                  safe_udid = str(uuid.UUID(udid))
              except ValueError:
                  continue
              if not device.get("isAvailable", True) or device.get("state") not in {"Booted", "Shutdown"}:
                  continue
              result = subprocess.run(
                  ["xcrun", "simctl", "get_app_container", udid, "com.lei11118.pdfvocab", "data"],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  continue
              log_path = Path(result.stdout.strip()) / "Documents" / "diagnostics.log"
              if not log_path.is_file():
                  continue
              shutil.copy2(log_path, output_dir / f"{safe_udid}.log")
              captured += 1
          print(f"Collected {captured} simulator diagnostics.log file(s).")
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.human_reading_only }}
        with:
          name: SimulatorDiagnostics
          path: build/SimulatorDiagnostics
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InkTests
          path: build/InkTests.xcresult
      - name: Collect UI review snapshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --help
          if [ -d build/InkTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/InkTests.xcresult --output-path build/UIReview
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UIReview
          path: build/UIReview
          if-no-files-found: warn
  export-snapshots:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot_run_id != '' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InkTests
          path: build/InkTests.xcresult
          run-id: ${{ inputs.snapshot_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export retained UI attachments
        run: |
          xcrun xcresulttool export attachments --help
          xcrun xcresulttool export attachments --path build/InkTests.xcresult --output-path build/UIReview
      - uses: actions/upload-artifact@v4
        with:
          name: UIReview
          path: build/UIReview
          if-no-files-found: error
